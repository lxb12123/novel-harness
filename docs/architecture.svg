<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 860" font-family="'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <!-- 目标形态：novel-harness 桌面应用 -->
  <rect x="150" y="30" width="850" height="100" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="575" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#1e1b4b">novel-harness 写作工作台</text>
  <text x="575" y="92" text-anchor="middle" font-size="14" fill="#4338ca">编辑器 · AI 助手对话 · 认知矩阵 · 局部关系图 · 事件记忆</text>
  <text x="575" y="116" text-anchor="middle" font-size="12" fill="#4338ca">最终形态：.dmg 桌面包 —— 用户下载安装即用</text>

  <line x1="575" y1="130" x2="575" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 本地服务 -->
  <rect x="150" y="200" width="850" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="575" y="225" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">本地服务 · FastAPI 薄壳</text>
  <text x="575" y="247" text-anchor="middle" font-size="12" fill="#475569">应用内嵌 · 本地运行</text>

  <line x1="575" y1="260" x2="575" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI 写作助手（harness 核心） -->
  <rect x="150" y="330" width="850" height="80" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="575" y="358" text-anchor="middle" font-size="20" font-weight="700" fill="#164e63">AI 写作助手 · 对话式 Agent（Harness 核心）</text>
  <text x="575" y="384" text-anchor="middle" font-size="13" fill="#155e75">起草 / 改写 / 查图谱 / 落正文 —— 像 Claude 写代码一样，一次对话里完成</text>

  <!-- LLM（可选） -->
  <rect x="1060" y="340" width="240" height="92" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1180" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">AI 模型（可选）</text>
  <text x="1180" y="392" text-anchor="middle" font-size="12" fill="#9a3412">OpenAI 兼容</text>
  <text x="1180" y="412" text-anchor="middle" font-size="12" fill="#9a3412">ollama</text>

  <line x1="1000" y1="370" x2="1055" y2="370" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>

  <!-- 能力层 -->
  <line x1="575" y1="410" x2="575" y2="480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="480" width="850" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="575" y="506" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">能力层（纯函数 · 可测可换）</text>

  <rect x="175" y="518" width="185" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="267.5" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">认知矩阵</text>
  <text x="267.5" y="559" text-anchor="middle" font-size="11" fill="#475569">panel</text>

  <rect x="380" y="518" width="185" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="472.5" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">一致性规则</text>
  <text x="472.5" y="559" text-anchor="middle" font-size="11" fill="#475569">checks</text>

  <rect x="585" y="518" width="185" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="677.5" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">起草与上下文</text>
  <text x="677.5" y="559" text-anchor="middle" font-size="11" fill="#475569">draft</text>

  <rect x="790" y="518" width="185" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="882.5" y="540" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">事件记忆</text>
  <text x="882.5" y="559" text-anchor="middle" font-size="11" fill="#475569">extract</text>

  <!-- 时态图层 -->
  <line x1="575" y1="580" x2="575" y2="650" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="650" width="850" height="64" rx="10" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="575" y="676" text-anchor="middle" font-size="18" font-weight="700" fill="#701a75">时态图层 · graph/queries.py</text>
  <text x="575" y="700" text-anchor="middle" font-size="13" fill="#a21caf">state_at + supersede · 时态过滤全系统唯一实现</text>

  <!-- 存储 -->
  <line x1="575" y1="714" x2="575" y2="780" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="150" y="780" width="850" height="64" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="575" y="806" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">SQLite 单文件 · 故事图谱</text>
  <text x="575" y="830" text-anchor="middle" font-size="13" fill="#475569">唯一真相源 · 正文在本机磁盘 Markdown</text>
</svg>
