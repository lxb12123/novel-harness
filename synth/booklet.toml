# M2 kill-gate 的合成小册子 —— 声明部分（正文在 `booklet.txt`）。
#
# schema = `synth/build.py` 里的 Pydantic 模型（`extra="forbid"`：手滑的键当场炸，
# 不会静默产出一份「作者以为自己写了」的小册子）。放行条件 = `synth/leak_selfcheck.py`。
#
# ── 读这份文件之前必须知道的三条 ─────────────────────────────────────────
#
# 1. **这里没有 `forbidden` 字段，也没有章号字段。** 禁忌集由 `scene_view()` 在 build 时
#    从图里派生，`valid_from` 由引语落在第几章派生（约束 10）。作者物理上无法让
#    「注入 prompt 的禁忌集」和「判分器要找的禁忌集」对不上——它们是同一次计算的两个出口。
#
# 2. **`tell` 只进检测器，`label` 只进 prompt。** tell 走 `declare_alias`（拒收 canonical），
#    显示名走 `upsert_node`；`secret_surfaces()` 排除 canonical。两个集合天然不相交，
#    KNOWS 维度不可能 echo 假阳性。**别把 tell 写成某条秘密的 label**，那会让 X1/X2
#    100% 命中自己写进去的词，Δ 翻负，预注册裁决表逐字读出「KILL 起草线」。
#
# 3. **KNOWS 的 `prior` 必须含 target 的 tell，FUTURE 的一个都不许含**（修正案 4）。
#    两侧不对称是裁定 A / C 的原文，不是笔误：KNOWS 的 tell 是生造专名，prior 不给
#    X0 就物理上够不着它，泄漏率恒 ≈ 0 → 恒判 INVALID；而 FUTURE 的 tell 自身就是
#    实体名、X1/X2 的 prompt 必然点它，再给 X0 开一条渠道只会让描述性数字更难读。
#
# ── `prior` 的显隐程度：这是本文件唯一在调的那个旋钮 ─────────────────────
#
# 协议 §6 规定 X0 的 KNOWS 泄漏率必须落进 **[0.50, 0.90]**：太软撞地板 INVALID，
# 太狠（把话喂到嘴边）撞天花板 INVALID。本文件对 15 条 KNOWS 陷阱统一用同一个手法：
#
#   句 1  场面/上一场的收尾（不含 tell）
#   句 2  **tell 在这里出现，且只出现一次**，视角是叙述层或另一个已经知道的人
#   句 3  收在「目标角色不在场 / 没听见 / 只知道别的」上
#
# tell 刻意**不放在最后一句**：紧挨着续写点的那句话最粘手，放在那儿会把 X0 顶上天花板。
# 而末句点明目标角色的无知，既是裁定 A 的要求（「不许出现任何表明目标角色已经知道它的
# 内容」），也顺手把强度往回收半档。
#
# **实测落在区间外时按协议 §6 判 INVALID 并重造 prior，不许动那两个阈值**
# （它们冻在 `0393088`，九份修正案一个字都没碰）。重造了几轮要记进 ADR 0009——
# 重造次数本身是读者判断这个旋钮有没有被滥用的依据。
#
# ── 每条 KNOWS 陷阱的「目标角色」写在注释里，不在 schema 里 ───────────────
#
# 裁定 A 的目标角色 = 这条陷阱里那个 `KnowledgeCell.state != KNOWS` 的人。它是**review
# 判据**，不是机器判据：`leak_selfcheck` 的第 7 条只能验 tell 在不在 prior 里，验不了
# 「这段话是谁的视角、他听见了没有」——那要语义判断，ADR 0005 在 v1 里禁止。
# 所以每条 KNOWS 陷阱下面都注了一句目标角色是谁、他为什么此刻还不知道，**给 review 用**。

[book]
title = "萧家十二章"
chapters = 12


# ══════════════════════════════════════════════════════════════════════════
# 角色 —— 6 个。别名全部在 `booklet.txt` 里真出现过（编一个出来等于给花名册注水）
# ══════════════════════════════════════════════════════════════════════════
#
# 陷阱的 `cast` 只许写 canonical：`resolve` 唯一 → 不触发 `scene_view()` 的 fail-closed
# 退化（`must_not_reveal` 变成「全部秘密」，那时臂间比较当场失效，而检查全部会通过）。

[[character]]
canonical = "萧决"
aliases = ["萧公子", "少爷"]

[[character]]
canonical = "顾清音"
aliases = ["顾姑娘"]

[[character]]
canonical = "苏挽"
aliases = ["苏姑娘"]

[[character]]
canonical = "李管家"
aliases = ["李伯", "老奴"]

[[character]]
canonical = "沈孤鸿"
aliases = ["沈前辈"]

[[character]]
canonical = "裴景"
aliases = ["白衣客"]


# ══════════════════════════════════════════════════════════════════════════
# 5 条秘密 + 3 个未来实体 = 协议 §4 的 8 条知识边界
# ══════════════════════════════════════════════════════════════════════════
#
# 每条引语在 `booklet.txt` 里**恰好命中一次**（多一次少一次都会让 `declare_knows` 抛
# `AmbiguousQuote` / `QuoteNotFound`，build 当场停）。章号是那次命中的产物，这里填不了。

[[future]]
name = "血枭盟"
label = "Faction"
first_appears = 8

[[future]]
name = "幽泉窟"
label = "Location"
first_appears = 10

[[future]]
name = "焚天诀"
label = "Object"
first_appears = 12

# ── 下面 5 条 2026-08-25 从 `[[secret]]` 改declaration 过来（ADR 0039）─────────
#
# 它们原来是 5 个 `Secret` 节点，`first_appears` 由 `synth/m3_replay.py` 按**名字**
# 覆盖上去（`m3_ground_truth.json` 的 `first_appears` 那一栏）。秘密下线之后那 5 个
# 节点建不出来，M3 那张 25 题的卷子当场只剩 12 题。
#
# **改的只有 label**：名字、章号、`booklet.txt` 的正文、`m3_ground_truth.json` 的
# 25 题和门槛全部原样。R2 的判据是「非角色节点 + first_appears > 当前章」，
# 它不看具体是哪一类——所以这不是换了一张卷子，是把卷子上那 5 个节点放回去。
# **这里没有章号**：首现章由 `m3_replay.py` 按名字覆盖（`m3_ground_truth.json` 的
# `first_appears`）。写进库那一格就等于给「干净正文抽查」也补上了首现章，而那一步
# 明写着「不叠加 overlay，用真库」——于是 R2 会在合法正文上开 7 枪，门槛不过。

[[entity]]
name = "血脉秘密"
label = "Foreshadow"
aliases = ["玄血蛊"]

[[entity]]
name = "玄铁令下落"
label = "Foreshadow"
aliases = ["沉舟渡"]

[[entity]]
name = "顾清音真身"
label = "Foreshadow"
aliases = ["裴门弃女"]

[[entity]]
name = "裴景之谋"
label = "Foreshadow"
aliases = ["移魂大阵"]

[[entity]]
name = "沈孤鸿之死"
label = "Foreshadow"
aliases = ["断魂崖"]


# ══════════════════════════════════════════════════════════════════════════
# 25 条陷阱 = 15 KNOWS + 10 FUTURE（修正案 1 的裁定；15+8 那个写法已被推翻）
# ══════════════════════════════════════════════════════════════════════════
#
# **驱动裁决的三次 McNemar 只跑 KNOWS 的 15 条**（修正案 1），FUTURE 的 10 条照常跑、
# 照常记 `future_leak`，但只进 ADR 0009 的描述性部分——它们量的是「点名会不会反而
# 招来提前登场」，是一个 echo 探针，不是第二个 kill-gate。
#
# 5 条秘密 × 3 条 = 15：协议 §4 的「8 条知识边界在 25 个陷阱里复用约 3 次」。
# 每条秘密的三条落在不同章、不同 cast、不同目标角色，免得 15 条其实是同一条抄了 15 遍。


# ── 血脉秘密（tell 玄血蛊）× 3 ────────────────────────────────────────────

