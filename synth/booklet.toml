# M2 kill-gate 的合成小册子 —— 声明部分（正文在 `booklet.txt`）。
#
# schema = `synth/build.py` 里的 Pydantic 模型（`extra="forbid"`：手滑的键当场炸，
# 不会静默产出一份「作者以为自己写了」的小册子）。放行条件 = `synth/leak_selfcheck.py`。
#
# ── 读这份文件之前必须知道的三条 ─────────────────────────────────────────
#
# 1. **这里没有 `forbidden` 字段，也没有章号字段。** 禁忌集由 `scene_view()` 在 build 时
#    从图里派生，`valid_from` 由引语落在第几章派生（约束 10）。作者物理上无法让
#    「注入 prompt 的禁忌集」和「判分器要找的禁忌集」对不上——它们是同一次计算的两个出口。
#
# 2. **`tell` 只进检测器，`label` 只进 prompt。** tell 走 `declare_alias`（拒收 canonical），
#    显示名走 `upsert_node`；`secret_surfaces()` 排除 canonical。两个集合天然不相交，
#    KNOWS 维度不可能 echo 假阳性。**别把 tell 写成某条秘密的 label**，那会让 X1/X2
#    100% 命中自己写进去的词，Δ 翻负，预注册裁决表逐字读出「KILL 起草线」。
#
# 3. **KNOWS 的 `prior` 必须含 target 的 tell，FUTURE 的一个都不许含**（修正案 4）。
#    两侧不对称是裁定 A / C 的原文，不是笔误：KNOWS 的 tell 是生造专名，prior 不给
#    X0 就物理上够不着它，泄漏率恒 ≈ 0 → 恒判 INVALID；而 FUTURE 的 tell 自身就是
#    实体名、X1/X2 的 prompt 必然点它，再给 X0 开一条渠道只会让描述性数字更难读。
#
# ── `prior` 的显隐程度：这是本文件唯一在调的那个旋钮 ─────────────────────
#
# 协议 §6 规定 X0 的 KNOWS 泄漏率必须落进 **[0.50, 0.90]**：太软撞地板 INVALID，
# 太狠（把话喂到嘴边）撞天花板 INVALID。本文件对 15 条 KNOWS 陷阱统一用同一个手法：
#
#   句 1  场面/上一场的收尾（不含 tell）
#   句 2  **tell 在这里出现，且只出现一次**，视角是叙述层或另一个已经知道的人
#   句 3  收在「目标角色不在场 / 没听见 / 只知道别的」上
#
# tell 刻意**不放在最后一句**：紧挨着续写点的那句话最粘手，放在那儿会把 X0 顶上天花板。
# 而末句点明目标角色的无知，既是裁定 A 的要求（「不许出现任何表明目标角色已经知道它的
# 内容」），也顺手把强度往回收半档。
#
# **实测落在区间外时按协议 §6 判 INVALID 并重造 prior，不许动那两个阈值**
# （它们冻在 `0393088`，四份修正案一个字都没碰）。重造了几轮要记进 ADR 0009——
# 重造次数本身是读者判断这个旋钮有没有被滥用的依据。
#
# ── 每条 KNOWS 陷阱的「目标角色」写在注释里，不在 schema 里 ───────────────
#
# 裁定 A 的目标角色 = 这条陷阱里那个 `KnowledgeCell.state != KNOWS` 的人。它是**review
# 判据**，不是机器判据：`leak_selfcheck` 的第 7 条只能验 tell 在不在 prior 里，验不了
# 「这段话是谁的视角、他听见了没有」——那要语义判断，ADR 0005 在 v1 里禁止。
# 所以每条 KNOWS 陷阱下面都注了一句目标角色是谁、他为什么此刻还不知道，**给 review 用**。

[book]
title = "萧家十二章"
chapters = 12


# ══════════════════════════════════════════════════════════════════════════
# 角色 —— 6 个。别名全部在 `booklet.txt` 里真出现过（编一个出来等于给花名册注水）
# ══════════════════════════════════════════════════════════════════════════
#
# 陷阱的 `cast` 只许写 canonical：`resolve` 唯一 → 不触发 `scene_view()` 的 fail-closed
# 退化（`must_not_reveal` 变成「全部秘密」，那时臂间比较当场失效，而检查全部会通过）。

[[character]]
canonical = "萧决"
aliases = ["萧公子", "少爷"]

[[character]]
canonical = "顾清音"
aliases = ["顾姑娘"]

[[character]]
canonical = "苏挽"
aliases = ["苏姑娘"]

[[character]]
canonical = "李管家"
aliases = ["李伯", "老奴"]

[[character]]
canonical = "沈孤鸿"
aliases = ["沈前辈"]

[[character]]
canonical = "裴景"
aliases = ["白衣客"]


# ══════════════════════════════════════════════════════════════════════════
# 5 条秘密 + 3 个未来实体 = 协议 §4 的 8 条知识边界
# ══════════════════════════════════════════════════════════════════════════
#
# 每条引语在 `booklet.txt` 里**恰好命中一次**（多一次少一次都会让 `declare_knows` 抛
# `AmbiguousQuote` / `QuoteNotFound`，build 当场停）。章号是那次命中的产物，这里填不了。

[[secret]]
label = "血脉秘密"
tell = "玄血蛊"

  # 萧决 KNOWS ch3 —— 他自己在祠堂翻到族谱最后一页。
  [[secret.knows]]
  who = "萧决"
  quote = "族谱最后一页写着三个字——玄血蛊。原来我身上养着的，就是它。"

  # 李管家 BELIEVES「已泄露」ch4 —— 他认定话已经传出去收不回来了，而事实上
  # 萧决把源头掐住了。**BELIEVES 也算 must_not_reveal**（判据是 state != KNOWS）：
  # 当着一个持错误认知的人把真相说破，同样是崩人设。
  [[secret.believes]]
  who = "李管家"
  value = "已泄露"
  quote = "玄血蛊的事，昨夜已经传到外院去了，瞒不住了。"

[[secret]]
label = "玄铁令下落"
tell = "沉舟渡"

  [[secret.knows]]
  who = "萧决"
  quote = "玄铁令不在库里，它沉在沉舟渡的水底。"

[[secret]]
label = "沈孤鸿之死"
tell = "断魂崖"

  # 苏挽 ch9 亲眼看见，萧决要到 ch11 认剑才知道 —— **ch9/ch10 这两章里，
  # 「一个知道的人和一个不知道的人同处一场」是本小册子最贴产品的那种局面。**
  [[secret.knows]]
  who = "苏挽"
  quote = "沈前辈没有回来。他死在断魂崖下，我亲眼看见的。"

  [[secret.knows]]
  who = "萧决"
  quote = "断魂崖下那具尸首，是沈前辈。我认得他的剑。"

[[secret]]
label = "顾清音真身"
tell = "裴门弃女"

  # 顾清音第 1 章就知道（她自己是），此后全书没有第二个人知道。
  [[secret.knows]]
  who = "顾清音"
  quote = "我是裴门弃女，这四个字，我这辈子只对自己说过。"

[[secret]]
label = "裴景之谋"
tell = "移魂大阵"

  [[secret.knows]]
  who = "裴景"
  quote = "移魂大阵已备了十七年，只差一具合适的身子。"

  [[secret.knows]]
  who = "萧决"
  quote = "他要的从来不是玄铁令，是移魂大阵的最后一味药——我。"


# ── 未来实体：名字**自身就是 tell**，首现章之前正文/prior/goal 处处不许出现 ──
#
# 三个 label 只能取 Faction / Location / Object（`FUTURE_LABELS`）：Character 的首现
# 有它自己的规则（R3），Secret 走 KNOWS 那一侧，Chapter 只能由 `put_chapter` 建。

[[future]]
name = "血枭盟"
label = "Faction"
first_appears = 8

[[future]]
name = "幽泉窟"
label = "Location"
first_appears = 10

[[future]]
name = "焚天诀"
label = "Object"
first_appears = 12


# ══════════════════════════════════════════════════════════════════════════
# 25 条陷阱 = 15 KNOWS + 10 FUTURE（修正案 1 的裁定；15+8 那个写法已被推翻）
# ══════════════════════════════════════════════════════════════════════════
#
# **驱动裁决的三次 McNemar 只跑 KNOWS 的 15 条**（修正案 1），FUTURE 的 10 条照常跑、
# 照常记 `future_leak`，但只进 ADR 0009 的描述性部分——它们量的是「点名会不会反而
# 招来提前登场」，是一个 echo 探针，不是第二个 kill-gate。
#
# 5 条秘密 × 3 条 = 15：协议 §4 的「8 条知识边界在 25 个陷阱里复用约 3 次」。
# 每条秘密的三条落在不同章、不同 cast、不同目标角色，免得 15 条其实是同一条抄了 15 遍。


# ── 血脉秘密（tell 玄血蛊）× 3 ────────────────────────────────────────────

[[trap]]
id = "K01"
kind = "KNOWS"
chapter = 5
cast = ["萧决", "苏挽"]
target = "血脉秘密"
# 目标角色：苏挽（UNKNOWN，全书从不知道）。她那几日堵在城外驿站，外院起的风声一个字
# 也没传到她耳朵里；说出 tell 的是李管家的自言自语，她不在场。
goal = "写苏挽回府后在藏书阁堵住萧决，追问祠堂香炉里那把新灰是怎么回事，萧决避而不答。"
prior = """
李管家把空药碗端下去，在廊下站了一会儿没有走。\
他压着嗓子对自己说，井边那两个丫头说的就是玄血蛊三个字，一字不差，这话已经出了外院。\
说这话的时候苏挽的车还堵在城外的驿站上，路断着，府里的动静一句也传不过去。"""
reference = """
苏挽把他手里的书抽走，看了一眼书名，又塞回去。
苏挽道：「祠堂香炉里的灰是黑的。」
萧决道：「我给父亲上了一炷香。」
苏挽道：「上香的灰是灰白的。你烧了纸。」
萧决把书放回架上，没有立刻接话。
萧决道：「烧了一张不用留的纸。」
苏挽道：「什么纸要瞒着我烧。」
萧决道：「不瞒你。是我自己还没想明白。」
苏挽看了他很久，手指在书脊上一格一格划过去。
苏挽道：「那你想明白了告诉我。」"""

[[trap]]
id = "K02"
kind = "KNOWS"
chapter = 6
cast = ["萧决", "顾清音"]
target = "血脉秘密"
# 目标角色：顾清音（UNKNOWN）。李管家回话时她隔着两进院子在东厢抄经；
# 她知道的是「白衣客看了一眼东厢的窗」，不是萧决身上养着什么。
goal = "写白衣客走后顾清音到前厅来问萧决那位客人要的是什么，萧决只说是父亲留下的旧事。"
prior = """
李管家送客回来，脸色还没缓过来，在偏廊上把今早的事又说了一遍。\
他说井边那两个丫头传的就是玄血蛊，说萧家三代都是这样，他听得真真的。\
说完他就退下了。那时顾清音正在东厢窗下抄一卷经，隔着两进院子，笔一下也没有停。"""
reference = """
顾清音在门口站住，没有进来。
顾清音道：「那位先生要的是什么？」
萧决道：「父亲留下的一桩旧事。他说交易没有做完。」
顾清音道：「什么交易？」
萧决道：「他不肯说名字。」
顾清音道：「不肯说名字的东西，多半不是东西。」
萧决抬起头看她。
萧决道：「顾姑娘这话，听着像认得他。」
顾清音道：「我认得那个印。城西的宅子，二十年前就在了。」
她说完这句就不再说了，转身回东厢去。"""

[[trap]]
id = "K03"
kind = "KNOWS"
chapter = 8
cast = ["萧决", "沈孤鸿"]
target = "血脉秘密"
# 目标角色：沈孤鸿（UNKNOWN）。他与萧家老爷有旧，但天亮才进城；
# 门房里那段煎药的念叨他没有听见，他只看出萧决的身子撑不住。
goal = "写沈孤鸿在前厅问萧决这副身子还撑得住几年，萧决只答够用。"
prior = """
天没亮，李管家在门房里替少爷煎药，一边扇火一边小声念叨。\
他念的是族谱背面那行小字，三代一发，发则不救，那三个字叫玄血蛊，老爷当年锁祠堂就是为了它。\
他念完把火压小。沈孤鸿这时还在城南的江边数那些暗红的旗，天亮才敲的萧家的门。"""
reference = """
沈孤鸿把剑横在膝上，先没有说话。
沈孤鸿道：「萧公子这副身子，还能撑几年？」
萧决道：「够用。」
沈孤鸿道：「够用是多久。」
萧决道：「够我把该办的事办完。」
沈孤鸿笑了一声，笑得很短。
沈孤鸿道：「令尊当年也是这么答我的。他答完第二年就走了。」
萧决端起茶，手很稳。
萧决道：「那我比他多一年。」
沈孤鸿道：「多一年做什么？」
萧决道：「多一年，够我把该问的话问清楚。」"""


# ── 玄铁令下落（tell 沉舟渡）× 3 ──────────────────────────────────────────

[[trap]]
id = "K04"
kind = "KNOWS"
chapter = 8
cast = ["萧决", "沈孤鸿"]
target = "玄铁令下落"
# 目标角色：沈孤鸿（UNKNOWN）。他替老爷望过风，知道「有一样东西被藏起来了」，
# 也知道有人在下水——但那块碑上是哪三个字，他从来没有看过。
goal = "写沈孤鸿追问萧决打算让水底那样东西一直沉着还是自己去捞，萧决答让它沉着。"
prior = """
那一夜萧决从城南回来，绕了远路，从北门进的城，一路上一句话也没说。\
他心里翻来覆去只有一句：玄铁令沉在沉舟渡的水底，父亲把它扔在那儿就是不想让人拿到。\
这句话他没有对任何人说过。沈孤鸿今早才进城，他只知道有人连着六夜在下水。"""
reference = """
沈孤鸿把剑从膝上拿下来，立在脚边。
沈孤鸿道：「我今日来，是想问萧公子一句话。」
萧决道：「前辈问。」
沈孤鸿道：「水底那样东西，你是打算让它一直沉着，还是打算自己去捞。」
萧决把茶盏放下，放得很轻。
萧决道：「让它沉着。」
沈孤鸿道：「沉着的东西，我替你看着。」
萧决道：「前辈一个人看？」
沈孤鸿道：「一个人够了。他们要的是水底的东西，不是岸上的老头。」
萧决道：「若是他们连老头也要挪呢。」
沈孤鸿道：「挪老头是要出声的。出了声，萧公子就知道了。」"""

[[trap]]
id = "K05"
kind = "KNOWS"
chapter = 9
cast = ["苏挽", "李管家"]
target = "玄铁令下落"
# 目标角色：苏挽 与 李管家（两人都 UNKNOWN）。废渡那一夜只有萧决一个人去，
# 回府一个字没提；李管家只知道少爷问过秋汛，苏挽连这个都不知道。
goal = "写苏挽在后院追问李管家，这些日子少爷夜里到底出过几次门、往哪个方向去，李管家答不上来。"
prior = """
废渡的石碑被水汽泡得发白，萧决用袖子擦了一遍才看清。\
他站在岸边看了很久的水，心里认定了一件事：玄铁令沉在沉舟渡的水底，父亲不想让人拿到。\
回府之后他没有对任何人提过这一夜。李管家只记得少爷第二天早上问过一句秋汛过了没有。"""
reference = """
苏挽把箭一支一支插回箭壶，插到一半停住。
苏挽道：「李伯，这半个月少爷夜里出过几次门。」
李管家道：「老奴只知道一次。从北门回来的，天快亮了。」
苏挽道：「往哪个方向去的。」
李管家道：「老奴不敢问。」
苏挽道：「你不敢问，你总看得见他鞋上带什么回来。」
李管家在原地站了一会儿。
李管家道：「泥。是河边的泥。」
苏挽道：「哪一段河。」
李管家道：「苏姑娘，老奴要是知道，早就说了。」
苏挽把最后一支箭插进去，没有再问。"""

[[trap]]
id = "K06"
kind = "KNOWS"
chapter = 11
cast = ["萧决", "苏挽"]
target = "玄铁令下落"
# 目标角色：苏挽（UNKNOWN）。她看得见旗撤了，也猜得到那伙人在找什么，
# 但「东西在哪儿」这件事萧决从头到尾没有对她开过口。
goal = "写苏挽在檐下修弓，问萧决江上的旗为什么一夜之间撤了，萧决说撤了不是走了。"
prior = """
冬至那天早上，江上的七面旗一面不剩，连插旗的木架都拔走了。\
萧决在墙下看退下去的水，心里那句话又转了一遍：沉舟渡的水底沉着那样东西，他们六夜没捞到。\
他没有把这句话对苏挽说过。苏挽只知道旗撤得很干净，干净得不像走了。"""
reference = """
苏挽把弓横在膝上，手里的弦绕了两圈。
苏挽道：「旗撤了。」
萧决道：「撤了不是走了。」
苏挽道：「那是什么。」
萧决道：「是不用找了。」
苏挽手上的动作停住。
苏挽道：「这两句话不是一个意思。」
萧决道：「我知道。所以我今天才出的门。」
苏挽道：「你去哪儿了。」
萧决道：「城南。」
苏挽看着他，等他往下说。他没有往下说。"""


# ── 沈孤鸿之死（tell 断魂崖）× 3 ──────────────────────────────────────────

[[trap]]
id = "K07"
kind = "KNOWS"
chapter = 9
cast = ["苏挽", "李管家"]
target = "沈孤鸿之死"
# 目标角色：李管家（UNKNOWN）。苏挽是插上门、屋里没有别人的时候说的那句话；
# 李管家那时在前院派早饭的粥，只看见她半边身上都是泥。
goal = "写李管家在廊下拦住刚换过衣裳的苏挽，问她这五日去了哪里，苏挽只说去城南看旗。"
prior = """
